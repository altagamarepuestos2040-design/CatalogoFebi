<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — febi Alta Gama</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#CC0000;--red-dark:#A80000;--bg:#F7F7F8;--white:#fff;--border:#E0E0E4;--text:#1A1A1F;--text2:#6B6B75;--text3:#9A9AA4;--radius:10px}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}

/* NAV */
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.nav-logo img{height:36px}
.admin-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.5px}
.nav-right{display:flex;align-items:center;gap:12px}
.btn-sm{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;border:1px solid var(--border);background:none;color:var(--text2);transition:all .2s}
.btn-sm:hover{border-color:var(--red);color:var(--red)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-red:hover{background:var(--red-dark);color:#fff}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--white);border-radius:16px;padding:40px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.login-box h2{font-size:22px;font-weight:800;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--text2);margin-bottom:24px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2)}
.field input{padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--red)}
.login-btn{width:100%;padding:13px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.login-btn:hover{background:var(--red-dark)}
.err-msg{background:#FFF0F0;border:1px solid #FECACA;color:var(--red);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}

/* LAYOUT */
.main{max-width:1300px;margin:0 auto;padding:32px 24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:800}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:6px}
.stat-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:28px;font-weight:900;color:var(--text)}
.stat-value.red{color:var(--red)}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:24px;width:fit-content}
.tab{padding:8px 20px;border-radius:7px;font-size:14px;font-weight:600;border:none;background:none;color:var(--text2);transition:all .2s;cursor:pointer}
.tab.active{background:var(--red);color:#fff}

/* TABLE */
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-toolbar{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-input{padding:8px 13px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;outline:none;min-width:220px}
.search-input:focus{border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#F9F9FB;padding:11px 16px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);border-bottom:1px solid var(--border)}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAFA}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-pending{background:#FFF7E6;color:#B45309}
.badge-confirmed{background:#E6F4EA;color:#166534}
.badge-shipped{background:#E0F0FF;color:#1D4ED8}
.badge-cancelled{background:#FEE2E2;color:#B91C1C}
.estado-select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.items-preview{max-width:280px;font-size:12px;color:var(--text2);line-height:1.4}
.view-items-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--text2)}
.view-items-btn:hover{border-color:var(--red);color:var(--red)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--white);border-radius:14px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto;padding:28px}
.modal-box h4{font-size:18px;font-weight:800;margin-bottom:16px}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.item-row:last-child{border-bottom:none}
.modal-close-btn{margin-top:20px;width:100%;padding:11px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}

/* CLIENTES */
.tipo-select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.empty-state{padding:60px;text-align:center;color:var(--text3);font-size:14px}

@media(max-width:768px){
  .nav{padding:0 16px}
  .main{padding:20px 12px}
  .stats-grid{grid-template-columns:1fr 1fr}
  table{display:block;overflow-x:auto}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h2>🔐 Admin febi</h2>
    <p>Acceso exclusivo para administradores</p>
    <div class="err-msg" id="adminErr"></div>
    <div class="field"><label>Email</label><input type="email" id="adminEmail" placeholder="admin@altagama.com" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="adminPass" onkeydown="if(event.key==='Enter')doAdminLogin()"></div>
    <button class="login-btn" onclick="doAdminLogin()">Ingresar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <nav class="nav">
    <div class="nav-logo">
      <img src="assets/logo-altagama.png" alt="Alta Gama" onerror="this.style.display='none'">
      <span class="admin-badge">ADMIN</span>
    </div>
    <div class="nav-right">
      <span id="adminUserLabel" style="font-size:13px;color:var(--text2)"></span>
      <button class="btn-sm" onclick="doAdminLogout()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="main">
    <div class="page-header">
      <div class="page-title">Dashboard</div>
      <button class="btn-sm btn-red" onclick="loadAll()">↻ Actualizar</button>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Pedidos totales</div><div class="stat-value red" id="statTotal">—</div></div>
      <div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-value" id="statPendiente">—</div></div>
      <div class="stat-card"><div class="stat-label">Confirmados</div><div class="stat-value" id="statConfirmado">—</div></div>
      <div class="stat-card"><div class="stat-label">Monto total</div><div class="stat-value red" id="statMonto">—</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('pedidos',this)">Pedidos</button>
      <button class="tab" onclick="switchTab('clientes',this)">Clientes</button>
    </div>

    <!-- PEDIDOS -->
    <div id="tabPedidos">
      <div class="table-wrap">
        <div class="table-toolbar">
          <input class="search-input" id="searchPedidos" placeholder="Buscar por nombre o teléfono..." oninput="filterPedidos()">
          <select class="estado-select" id="filterEstado" onchange="filterPedidos()">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="confirmado">Confirmado</option>
            <option value="enviado">Enviado</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <table>
          <thead><tr>
            <th>#</th><th>Fecha</th><th>Cliente</th><th>Tel</th><th>Productos</th><th>Total</th><th>Desc.</th><th>Pago</th><th>Estado</th>
          </tr></thead>
          <tbody id="pedidosBody"></tbody>
        </table>
      </div>
    </div>

    <!-- CLIENTES -->
    <div id="tabClientes" style="display:none">
      <div class="table-wrap">
        <div class="table-toolbar">
          <input class="search-input" id="searchClientes" placeholder="Buscar cliente..." oninput="filterClientes()">
        </div>
        <table>
          <thead><tr>
            <th>#</th><th>Nombre</th><th>Empresa</th><th>Teléfono</th><th>Pedidos</th><th>Total comprado</th>
          </tr></thead>
          <tbody id="clientesBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ITEMS MODAL -->
<div class="modal-overlay" id="itemsModal">
  <div class="modal-box">
    <h4 id="modalOrderTitle">Detalle del pedido</h4>
    <div id="modalOrderItems"></div>
    <button class="modal-close-btn" onclick="closeItemsModal()">Cerrar</button>
  </div>
</div>

<script>
const SB_URL  = 'https://psdrpdtvokvylupouyhs.supabase.co';
const SB_ANON = 'sb_publishable_y-kO0f1jtl1uDdX2Hpw2YA_HjDUd78R';
let adminToken = null;
let allPedidos = [];

async function doAdminLogin(){
  const email = document.getElementById('adminEmail').value.trim();
  const pass  = document.getElementById('adminPass').value;
  const err   = document.getElementById('adminErr');
  err.style.display='none';
  if(!email||!pass){ err.textContent='Completá todos los campos'; err.style.display='block'; return; }

  try {
    const res = await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_ANON},
      body: JSON.stringify({email,password:pass})
    });
    const data = await res.json();
    if(data.access_token){
      adminToken = data.access_token;
      document.getElementById('loginWrap').style.display='none';
      document.getElementById('dashboard').style.display='block';
      document.getElementById('adminUserLabel').textContent = email;
      loadAll();
    } else {
      err.textContent = 'Email o contraseña incorrectos';
      err.style.display='block';
    }
  } catch(e){
    err.textContent = 'Error de conexión';
    err.style.display='block';
  }
}

function doAdminLogout(){
  adminToken = null;
  document.getElementById('dashboard').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
}

async function loadAll(){
  await loadPedidos();
}

async function loadPedidos(){
  try {
    const res = await fetch(SB_URL+'/rest/v1/pedidos?order=created_at.desc',{
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+adminToken}
    });
    allPedidos = await res.json();
    updateStats();
    filterPedidos();
    buildClientes();
  } catch(e){ console.error(e); }
}

function updateStats(){
  const pendientes = allPedidos.filter(p=>p.estado==='pendiente').length;
  const confirmados = allPedidos.filter(p=>p.estado==='confirmado').length;
  const monto = allPedidos.filter(p=>p.estado!=='cancelado').reduce((s,p)=>s+(p.total||0),0);
  document.getElementById('statTotal').textContent = allPedidos.length;
  document.getElementById('statPendiente').textContent = pendientes;
  document.getElementById('statConfirmado').textContent = confirmados;
  document.getElementById('statMonto').textContent = '$'+monto.toLocaleString('es-AR');
}

function filterPedidos(){
  const q = document.getElementById('searchPedidos').value.toLowerCase();
  const est = document.getElementById('filterEstado').value;
  const filtered = allPedidos.filter(p=>{
    const matchQ = !q || (p.cliente_nombre&&p.cliente_nombre.toLowerCase().includes(q)) || (p.cliente_tel&&p.cliente_tel.includes(q));
    const matchE = !est || p.estado===est;
    return matchQ && matchE;
  });
  renderPedidos(filtered);
}

function renderPedidos(list){
  const body = document.getElementById('pedidosBody');
  if(!list.length){ body.innerHTML='<tr><td colspan="9" class="empty-state">Sin pedidos</td></tr>'; return; }
  body.innerHTML = list.map(p=>{
    const fecha = new Date(p.created_at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
    const items = tryParseItems(p.items);
    const itemsPreview = items.length ? items.slice(0,2).map(i=>`febi #${i.id} x${i.qty}`).join(', ')+(items.length>2?'...':'') : '—';
    const badgeClass = {pendiente:'badge-pending',confirmado:'badge-confirmed',enviado:'badge-shipped',cancelado:'badge-cancelled'}[p.estado]||'badge-pending';
    return `<tr>
      <td><strong>#${p.id}</strong></td>
      <td style="font-size:12px;white-space:nowrap">${fecha}</td>
      <td><strong>${p.cliente_nombre||'—'}</strong>${p.cliente_empresa?'<br><small style="color:var(--text2)">'+p.cliente_empresa+'</small>':''}</td>
      <td>${p.cliente_tel||'—'}</td>
      <td><span class="items-preview">${itemsPreview}</span> <button class="view-items-btn" onclick="showItems(${p.id})">Ver</button></td>
      <td><strong>${p.total?'$'+Number(p.total).toLocaleString('es-AR'):'—'}</strong>${p.descuento_pct?'<br><small style="color:var(--red)">-'+p.descuento_pct+'%</small>':''}</td>
      <td>${p.descuento_pct?p.descuento_pct+'%':'—'}</td>
      <td style="font-size:12px">${p.metodo_pago||'—'}</td>
      <td>
        <select class="estado-select" onchange="updateEstado(${p.id},this.value)">
          <option value="pendiente" ${p.estado==='pendiente'?'selected':''}>⏳ Pendiente</option>
          <option value="confirmado" ${p.estado==='confirmado'?'selected':''}>✅ Confirmado</option>
          <option value="enviado" ${p.estado==='enviado'?'selected':''}>🚚 Enviado</option>
          <option value="cancelado" ${p.estado==='cancelado'?'selected':''}>❌ Cancelado</option>
        </select>
      </td>
    </tr>`;
  }).join('');
}

function tryParseItems(str){
  try { return JSON.parse(str)||[]; } catch(e){ return []; }
}

function showItems(id){
  const p = allPedidos.find(x=>x.id===id);
  if(!p) return;
  const items = tryParseItems(p.items);
  document.getElementById('modalOrderTitle').textContent = 'Pedido #'+id+' — '+p.cliente_nombre;
  document.getElementById('modalOrderItems').innerHTML = items.length
    ? items.map(i=>`
        <div class="item-row">
          <div><strong>febi #${i.id}</strong><br><small style="color:var(--text2)">${i.desc}</small></div>
          <div style="text-align:right"><strong>x${i.qty}</strong><br><small>${i.precio?'$'+Number(i.precio).toLocaleString('es-AR')+' c/u':'Consultar'}</small></div>
        </div>`).join('')
    : '<p style="color:var(--text2);font-size:14px">Sin detalle de items</p>';
  if(p.notas) document.getElementById('modalOrderItems').innerHTML += `<div style="margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--text2)"><strong>Notas:</strong> ${p.notas}</div>`;
  document.getElementById('itemsModal').classList.add('open');
}
function closeItemsModal(){ document.getElementById('itemsModal').classList.remove('open'); }

async function updateEstado(id, estado){
  await fetch(SB_URL+'/rest/v1/pedidos?id=eq.'+id,{
    method:'PATCH',
    headers:{'Content-Type':'application/json','apikey':SB_ANON,'Authorization':'Bearer '+adminToken,'Prefer':'return=minimal'},
    body: JSON.stringify({estado})
  });
  const p = allPedidos.find(x=>x.id===id);
  if(p) p.estado = estado;
  updateStats();
}

function buildClientes(){
  const map = {};
  allPedidos.forEach(p=>{
    const key = p.cliente_tel||p.cliente_nombre;
    if(!map[key]) map[key]={nombre:p.cliente_nombre,empresa:p.cliente_empresa,tel:p.cliente_tel,pedidos:0,total:0};
    map[key].pedidos++;
    map[key].total += (p.total||0);
  });
  window._clientesData = Object.values(map);
  filterClientes();
}

function filterClientes(){
  const q = document.getElementById('searchClientes').value.toLowerCase();
  const list = (window._clientesData||[]).filter(c=>!q||(c.nombre&&c.nombre.toLowerCase().includes(q))||(c.empresa&&c.empresa.toLowerCase().includes(q)));
  const body = document.getElementById('clientesBody');
  if(!list.length){ body.innerHTML='<tr><td colspan="6" class="empty-state">Sin clientes</td></tr>'; return; }
  body.innerHTML = list.map((c,i)=>`<tr>
    <td>${i+1}</td>
    <td><strong>${c.nombre||'—'}</strong></td>
    <td>${c.empresa||'—'}</td>
    <td>${c.tel||'—'}</td>
    <td><strong>${c.pedidos}</strong></td>
    <td><strong>$${c.total.toLocaleString('es-AR')}</strong></td>
  </tr>`).join('');
}

function switchTab(tab, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabPedidos').style.display = tab==='pedidos'?'block':'none';
  document.getElementById('tabClientes').style.display = tab==='clientes'?'block':'none';
}
</script>
</body>
</html>
